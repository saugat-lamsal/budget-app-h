# Two runs (CLAUDE.md, "Two test runs"). On every pull request, the default
# run (npm test), split in two jobs that run at the same time:
# - checks: the type check, then every test that does not use a browser
#   (money, server, web, repo), with SKIP_BROWSER_TESTS=1;
# - webkit 1/2 and webkit 2/2: the browser tests in WebKit only
#   (BROWSER_ENGINE=webkit), iPhone Safari's engine, split by file in two
#   shards that run at the same time (vitest --shard), so the browser tests
#   take about half as long. Main requires both.
# Together they are exactly npm test: test/ci-workflow.test.ts checks that no
# test is left out. By hand (Actions, Tests, Run workflow, "Run the slow
# tests" ticked) the slow run (npm run test:slow, TEST_SLOW=1) instead:
# checks with the slow tests in, and the browser tests in Chromium.
# The checks job first puts Litestream on the runner (Phase 6: the backup
# tests run it against a stand-in for R2), kept between runs.
#
# Phase 6, a fourth job, image: builds the image Fly.io builds (Dockerfile)
# and starts it the way Fly does, against the stand-in for R2. Linux only. It
# is not part of npm test (it needs Docker): its one test is skipped there.
#
# On every pull request: Linux only. Windows minutes count double, so
# Windows runs only when started by hand (Actions, Tests, Run workflow,
# pick the branch), for a phase's finish line. The manual run asks which
# systems: Windows (the default), Linux, or both.
name: Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      systems:
        description: Which systems to run on
        type: choice
        options:
          - windows
          - linux
          - both
        default: windows
      slow:
        description: Run the slow tests (npm run test:slow), with the browser tests in Chromium instead of WebKit
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same pull request replaces the run still going. A run
# started by hand is never replaced by a push, nor a push's run by it.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.part }}${{ matrix.part != 'checks' && format(' {0}/2', matrix.shard) || '' }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || inputs.systems == 'both' && '["ubuntu-latest","windows-latest"]' || inputs.systems == 'linux' && '["ubuntu-latest"]' || '["windows-latest"]') }}
        part: ${{ fromJSON(inputs.slow == true && '["checks","chromium"]' || '["checks","webkit"]') }}
        # The browser tests in two shards; the checks job is one job.
        shard: [1, 2]
        exclude:
          - part: checks
            shard: 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.slow == true && 150 || 45 }}
    env:
      TEST_SLOW: ${{ inputs.slow == true && '1' || '0' }}
    steps:
      # Pinned to exact commits; the comment says which release each one is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Phase 6: Litestream for the backup tests, the version the image has
      # (scripts/litestream.mjs checks its SHA-256), kept between runs.
      - name: Keep Litestream between runs
        if: matrix.part == 'checks'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/budget-app
          key: litestream-${{ runner.os }}-${{ hashFiles('scripts/litestream.mjs') }}
      - name: Litestream for the backup tests
        if: matrix.part == 'checks'
        run: node scripts/litestream.mjs

      # The type check, then everything but the browser tests.
      - name: Type check
        if: matrix.part == 'checks'
        run: npm run typecheck
      - name: Every test without a browser
        if: matrix.part == 'checks'
        env:
          SKIP_BROWSER_TESTS: '1'
        run: npx vitest run

      # The browser tests use the screens in WebKit (iPhone Safari's engine; in
      # the slow run, Chromium): Playwright's own copies, at the version in
      # package-lock.json. Each browser job downloads only its own browser.
      # The browsers are kept between runs, one copy per system, browser and
      # Playwright version; a new version downloads them again.
      - name: Playwright version
        if: matrix.part != 'checks'
        id: playwright
        shell: bash
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Keep the Playwright browser between runs
        if: matrix.part != 'checks'
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ matrix.part }}-${{ steps.playwright.outputs.version }}
      - name: Download the browser
        if: matrix.part != 'checks' && steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.part }}
      # The system libraries the browser needs are not in the kept copy, so
      # Linux installs them every time (Windows needs none).
      - name: Install the browser's system libraries
        if: matrix.part != 'checks' && steps.browsers.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: npx playwright install-deps ${{ matrix.part }}
      - name: The browser tests in ${{ matrix.part }}
        if: matrix.part != 'checks'
        env:
          BROWSER_ENGINE: ${{ matrix.part }}
        run: npx vitest run --project web-browser --shard=${{ matrix.shard }}/2

  image:
    name: image (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the image, as Fly does
        run: docker build --tag budget-app:test .
      - name: Start it as Fly does, and check it
        env:
          IMAGE: budget-app:test
        run: npx vitest run --project server test/image.test.ts
